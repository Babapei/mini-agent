[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-agent"
version = "0.1.0"
description = "一个会连续调用工具的 Mini Agent"
requires-python = ">=3.9"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["mini_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
